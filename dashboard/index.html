<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#151412">
  <title>loew.fi runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Momo+Trust+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="terra-accent" aria-hidden="true">
    <span class="accent-photo"></span>
    <span class="accent-design"></span>
    <span class="accent-software"></span>
  </div>

  <main class="shell">
    <header class="brand-header">
      <div>
        <div class="eyebrow">LOEW.FI / TERRA PRIME</div>
        <h1>runner</h1>
        <p class="lede">background work, without the noise</p>
      </div>
      <div class="header-status">
        <span id="connection" class="status-pill status-neutral">
          <span class="status-dot"></span>
          <span>CONNECTING</span>
        </span>
      </div>
    </header>

    <div class="app-toolbar" data-figma-component="App / Toolbar">
      <strong>Control surface</strong>
      <div class="toolbar-actions">
        <span class="toolbar-meta">GITHUB · CLOUDFLARE · AGENTS</span>
        <button id="refresh" class="tp-button secondary compact" type="button">Refresh</button>
      </div>
    </div>

    <div class="app-grid">
      <aside class="sidebar" aria-label="Workers">
        <div class="section-kicker">WORKERS</div>
        <div id="worker-nav" class="worker-nav"></div>
        <div class="sidebar-note">Target repositories remain read-only unless a guarded workflow explicitly says otherwise.</div>
      </aside>

      <section class="workspace">
        <nav class="tabs" aria-label="Runner view">
          <button class="app-tab active" data-view="overview" type="button">Overview</button>
          <button class="app-tab" data-view="diagnostics" type="button">Diagnostics</button>
        </nav>

        <section class="summary" id="summary" aria-label="Runner summary"></section>
        <section class="workers" id="workers" aria-live="polite"></section>
      </section>
    </div>

    <footer>
      <span>loew-runner · v0.2</span>
      <span>Terra Prime Application UI</span>
    </footer>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
