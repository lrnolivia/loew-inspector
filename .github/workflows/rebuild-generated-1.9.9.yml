name: Rebuild generated 1.9.9

on:
  push:
    branches:
      - relay/1.9.9-chatgpt-native-experience-20261001
    paths:
      - '.github/workflows/rebuild-generated-1.9.9.yml'

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/1.9.9-chatgpt-native-experience-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Rebuild exact web artifact and retire helper
        shell: bash
        run: |
          npm run build
          git config user.name "relay-build[bot]"
          git config user.email "relay-build[bot]@users.noreply.github.com"
          git add apps/web/generated.js
          git rm .github/workflows/rebuild-generated-1.9.9.yml
          git commit -m "Rebuild final Relay 1.9.9 web artifact"
          git push origin HEAD:relay/1.9.9-chatgpt-native-experience-20261001
