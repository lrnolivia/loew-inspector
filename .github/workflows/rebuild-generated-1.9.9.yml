name: Rebuild generated 1.9.9

on:
  push:
    branches:
      - relay/1.9.9-chatgpt-native-experience-20261001
    paths:
      - '.github/workflows/rebuild-generated-1.9.9.yml'
      - 'apps/web/public/**'
      - 'apps/web/build.mjs'
      - 'packages/shared-ui/**'

permissions:
  contents: write

concurrency:
  group: relay-1-9-9-generated
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/1.9.9-chatgpt-native-experience-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Rebuild committed web artifact
        run: npm run build
      - name: Commit generated artifact if changed
        shell: bash
        run: |
          if git diff --quiet -- apps/web/generated.js; then
            echo "generated.js already current"
            exit 0
          fi
          git config user.name "relay-build[bot]"
          git config user.email "relay-build[bot]@users.noreply.github.com"
          git add apps/web/generated.js
          git commit -m "Rebuild shared Relay web and MCP interface"
          git push origin HEAD:relay/1.9.9-chatgpt-native-experience-20261001
