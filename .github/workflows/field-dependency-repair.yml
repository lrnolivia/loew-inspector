name: field dependency repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-dependency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      FIELD_TOKEN: ${{ secrets.RUNNER_GITHUB_TOKEN }}

    steps:
      - name: Require guarded write token
        run: |
          if [ -z "$FIELD_TOKEN" ]; then
            echo "::error::RUNNER_GITHUB_TOKEN is required. Use a fine-grained token scoped to lrnolivia/field with Contents write and Pull requests write."
            exit 1
          fi

      - name: Checkout field
        uses: actions/checkout@v6
        with:
          repository: lrnolivia/field
          ref: main
          path: target
          token: ${{ env.FIELD_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Regenerate lockfile only
        id: repair
        working-directory: target
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is already synchronized."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json
          fi

      - name: Guard repair scope
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        run: |
          unexpected="$(git status --short | grep -vE '^ M package-lock\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Repair changed files outside package-lock.json:"
            echo "$unexpected"
            exit 1
          fi

      - name: Verify clean install
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        run: npm ci

      - name: Verify build
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        run: npm run build:all

      - name: Verify unit tests
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        run: npm run test:run

      - name: Verify lint
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        run: npm run lint

      - name: Open repair PR
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ env.FIELD_TOKEN }}
        run: |
          branch="automation/dependency-lockfile-${GITHUB_RUN_ID}"
          git config user.name "loew-runner"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add package-lock.json
          git commit -m "Repair package lockfile"
          git push origin "$branch"

          gh pr create             --repo lrnolivia/field             --base main             --head "$branch"             --title "Repair field package lockfile"             --body "Generated by loew-runner after Dependency Doctor verified the repair path. This PR changes only package-lock.json. Before opening it, the workflow passed npm ci, build:all, unit tests, and lint."
