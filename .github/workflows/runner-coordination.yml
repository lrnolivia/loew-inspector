name: loew inspector work coordination

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "38,8 * * * *"
  workflow_dispatch:
    inputs:
      action:
        type: choice
        options: [audit, cleanup]
        default: audit

permissions:
  contents: read
  pull-requests: read

jobs:
  admission:
    name: Runner coordination admission
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lrnolivia/relay
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Verify live ownership and exact PR scope
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -f projects/relay.json ]; then
            project=relay
            engine=scripts/coordinate.mjs
          else
            gh api repos/lrnolivia/loew-runner/contents/scripts/coordinate.mjs?ref=main --jq .content | base64 -d > "$RUNNER_TEMP/coordinate.mjs"
            gh api repos/lrnolivia/loew-runner/contents/src/coordination.mjs?ref=main --jq .content | base64 -d > "$RUNNER_TEMP/coordination.mjs"
            sed 's@../src/coordination.mjs@./coordination.mjs@' "$RUNNER_TEMP/coordinate.mjs" > "$RUNNER_TEMP/admit.mjs"
            project=loew-inspector
            engine="$RUNNER_TEMP/admit.mjs"
          fi
          # Admission is read-only; the migration freeze blocks writes, not inspection.
          if [ "$project" = loew-inspector ]; then
            sed -i "s/if (read(recordPath).value.migration_frozen)/if (action !== 'pr-gate' \&\& read(recordPath).value.migration_frozen)/" "$engine"
          fi
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/request.json", JSON.stringify({pr: Number(process.env.TASK_PR)}))'
          node "$engine" pr-gate "$project" "$RUNNER_TEMP/request.json"

  hygiene:
    name: Runner managed branch hygiene
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: loew-inspector-managed-branch-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          repository: lrnolivia/relay
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Reconcile and remove completed managed branches
        env:
          GH_TOKEN: ${{ github.token }}
          COORD_ACTION: ${{ inputs.action || 'cleanup' }}
        run: node scripts/coordinate.mjs "$COORD_ACTION" relay > "$RUNNER_TEMP/coordination-result.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loew-inspector-coordination-receipt
          path: ${{ runner.temp }}/coordination-result.json
      - name: Show coordination findings
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/coordination-result.json" ]; then
            cat "$RUNNER_TEMP/coordination-result.json" >> "$GITHUB_STEP_SUMMARY"
          fi
