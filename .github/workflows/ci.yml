name: Relay workspace checks

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: inspector-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install deterministic Chromium harness
        run: npx playwright install --with-deps chromium
      - name: Test Relay workspace boundaries and implementations
        run: npm test
      - name: Typecheck Relay 2.0 React boundary
        run: npm run typecheck:2.0 --workspace @relay/web
      - name: Build Relay 2.0 React boundary
        run: npm run build:2.0 --workspace @relay/web
      - name: Verify shared web and MCP build
        run: npm run build && git diff --exit-code -- apps/web/generated.js
