name: Relay workspace checks

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: inspector-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:inspector

  runner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:runner

  layout-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:layout

  contract-test-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.files.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: echo "matrix=$(node -e 'const fs=require("fs");process.stdout.write(JSON.stringify(fs.readdirSync("test").filter(f=>f.endsWith(".test.mjs")).sort()))')" >> "$GITHUB_OUTPUT"

  contract-file:
    needs: contract-test-files
    name: contract-${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.contract-test-files.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test "test/${{ matrix.file }}"

  web-test-files:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.files.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: files
        shell: bash
        run: echo "matrix=$(node -e 'const fs=require("fs");process.stdout.write(JSON.stringify(fs.readdirSync("apps/web/test").filter(f=>f.endsWith(".test.mjs")).sort()))')" >> "$GITHUB_OUTPUT"

  web-file:
    needs: web-test-files
    name: web-${{ matrix.file }}
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.web-test-files.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Install deterministic Chromium harness
        run: npx playwright install --with-deps chromium
      - run: node --test "apps/web/test/${{ matrix.file }}"

  typecheck-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck:2.0 --workspace @relay/web

  vite-build-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:2.0 --workspace @relay/web

  generated-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # The committed React + Inspector bridge must be the deterministic output of the same sources under review.
      - run: npm run build && git diff --exit-code -- apps/web/generated.js
