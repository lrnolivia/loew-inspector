name: Relay workspace checks

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: inspector-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:inspector

  runner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:runner

  layout-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:layout

  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test:contracts

  web-api-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: node --test apps/web/test/api.test.mjs

  web-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test apps/web/test/browser.test.mjs

  web-react-shell-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-name-pattern="Relay 2.0 React shell renders human-first live surfaces responsively" apps/web/test/react.test.mjs

  web-react-mcp-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-name-pattern="generated cutover publishes the React control center through the authenticated MCP bridge" apps/web/test/react.test.mjs

  typecheck-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck:2.0 --workspace @relay/web

  vite-build-2-0:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build:2.0 --workspace @relay/web

  generated-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build && git diff --exit-code -- apps/web/generated.js apps/web/generated-react.js apps/web/generated-inspector.js


  visual-review-preview:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && startsWith(github.head_ref, 'relay/2.0-approved-visual-port-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF }}
      PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      PREVIEW_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build exact Relay web assets
        run: npm run build --workspace @relay/web
      - name: Capture and ingest Inspector preview evidence
        run: node apps/web/test/visual-review.mjs
      - name: Preserve preview captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-visual-review-${{ github.event.pull_request.number }}
          path: qa-evidence/
          if-no-files-found: ignore
