name: Relay generated bridge refresh

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-2.0-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/2.0-today-runner-react-slice-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh legacy generated web bridge
        run: npm run build --workspace @relay/web
      - name: Commit generated bridge and remove helper
        run: |
          git config user.name "relay-release"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/generated.js
          git rm .github/workflows/relay-2.0-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh Relay generated web bridge"
          git push origin HEAD:relay/2.0-today-runner-react-slice-20261001
