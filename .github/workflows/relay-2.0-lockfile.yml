name: Relay 2.0 lockfile + build proof

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/package.json'
      - 'package-lock.json'
      - '.github/workflows/relay-2.0-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/2.0-today-runner-react-slice-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Clean install
        run: npm ci
      - name: Typecheck Relay 2.0
        run: npm run typecheck:2.0 --workspace @relay/web
      - name: Build Relay 2.0
        run: npm run build:2.0 --workspace @relay/web
      - name: Commit generated lockfile and remove helper
        run: |
          git config user.name "relay-release"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/relay-2.0-lockfile.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: refresh Relay 2.0 lockfile"
          git push origin HEAD:relay/2.0-today-runner-react-slice-20261001
