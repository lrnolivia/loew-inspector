name: field dependency doctor

on:
  workflow_dispatch:
  schedule:
    - cron: "23 10 * * 1"

permissions:
  contents: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout runner
        uses: actions/checkout@v6
        with:
          path: runner

      - name: Checkout field
        uses: actions/checkout@v6
        with:
          repository: lrnolivia/field
          ref: main
          path: target

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Environment
        run: |
          mkdir -p doctor
          {
            echo "node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "os: $(uname -a)"
          } | tee doctor/environment.txt

      - name: Clean dependency install
        id: install
        continue-on-error: true
        working-directory: target
        run: |
          set -o pipefail
          npm ci 2>&1 | tee ../doctor/npm-ci.log

      - name: Classify install failure
        if: steps.install.outcome != 'success'
        run: |
          node runner/scripts/classify-install.mjs doctor/npm-ci.log > doctor/report.md
          cat doctor/report.md

      - name: Build all field surfaces
        id: build
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: target
        run: npm run build:all

      - name: Unit tests
        id: tests
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: target
        run: npm run test:run

      - name: Lint
        id: lint
        if: steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: target
        run: npm run lint

      - name: Summary
        if: always()
        run: |
          {
            echo "# field dependency doctor"
            echo
            echo "| check | outcome |"
            echo "| --- | --- |"
            echo "| npm ci | ${{ steps.install.outcome }} |"
            echo "| build | ${{ steps.build.outcome }} |"
            echo "| tests | ${{ steps.tests.outcome }} |"
            echo "| lint | ${{ steps.lint.outcome }} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: field-dependency-doctor
          path: doctor/
          if-no-files-found: ignore

      - name: Fail on unhealthy result
        if: always()
        run: |
          test "${{ steps.install.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
