name: Relay 2.0 cutover diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-2.0-cutover-build.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'relay/2.0-production-cutover-r2-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/2.0-production-cutover-r2-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture failing suite output
        shell: bash
        run: |
          set +e
          npm run test:inspector > /tmp/inspector.log 2>&1
          INSPECTOR=$?
          npm run test:layout > /tmp/layout.log 2>&1
          LAYOUT=$?
          npm run test:contracts > /tmp/contracts.log 2>&1
          CONTRACTS=$?
          npm test --workspace @relay/web > /tmp/web.log 2>&1
          WEB=$?
          set -e
          {
            echo
            echo "# CUTOVER_DIAGNOSTICS_BEGIN"
            echo "# CUTOVER_INSPECTOR_EXIT=$INSPECTOR"
            echo "# CUTOVER_INSPECTOR_B64=$(tail -c 12000 /tmp/inspector.log | base64 -w0)"
            echo "# CUTOVER_LAYOUT_EXIT=$LAYOUT"
            echo "# CUTOVER_LAYOUT_B64=$(tail -c 8000 /tmp/layout.log | base64 -w0)"
            echo "# CUTOVER_CONTRACTS_EXIT=$CONTRACTS"
            echo "# CUTOVER_CONTRACTS_B64=$(tail -c 12000 /tmp/contracts.log | base64 -w0)"
            echo "# CUTOVER_WEB_EXIT=$WEB"
            echo "# CUTOVER_WEB_B64=$(tail -c 12000 /tmp/web.log | base64 -w0)"
            echo "# CUTOVER_DIAGNOSTICS_END"
          } >> .github/workflows/ci.yml
          git config user.name "relay-release"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git rm .github/workflows/relay-2.0-cutover-build.yml
          git commit -m "ci: capture Relay 2.0 cutover diagnostics"
          git push origin HEAD:relay/2.0-production-cutover-r2-20261001
