name: Relay 2.0 diagnostic cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-2.0-cutover-build.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.ref == 'relay/2.0-production-cutover-r2-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/2.0-production-cutover-r2-20261001
          fetch-depth: 0
      - name: Remove temporary diagnostic workflow
        run: |
          git config user.name "relay-release"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/relay-2.0-cutover-build.yml
          git commit -m "ci: remove Relay cutover diagnostics"
          git push origin HEAD:relay/2.0-production-cutover-r2-20261001
