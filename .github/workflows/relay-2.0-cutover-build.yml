name: Relay 2.0 cutover asset refresh

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-2.0-cutover-build.yml'

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.ref == 'relay/2.0-production-cutover-r2-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/2.0-production-cutover-r2-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build deterministic Relay 2.0 Worker assets
        run: npm run build --workspace @relay/web
      - name: Commit generated bridge and remove helper
        run: |
          git config user.name "relay-release"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/generated.js
          git rm .github/workflows/relay-2.0-cutover-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "build: generate Relay 2.0 production assets"
          git push origin HEAD:relay/2.0-production-cutover-r2-20261001
