name: Relay cutover test inventory

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-2.0-cutover-build.yml'

permissions:
  contents: write

jobs:
  inventory:
    if: github.event.pull_request.head.ref == 'relay/2.0-production-cutover-r2-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/2.0-production-cutover-r2-20261001
          fetch-depth: 0
      - name: Record test filenames and remove helper
        shell: bash
        run: |
          {
            echo
            echo "# CUTOVER_TEST_FILES_BEGIN"
            find test -maxdepth 1 -type f -name '*.test.mjs' -printf '# CONTRACT_FILE=%f\n' | sort
            find src -maxdepth 1 -type f -name '*.test.js' -printf '# INSPECTOR_FILE=%f\n' | sort
            echo "# CUTOVER_TEST_FILES_END"
          } >> .github/workflows/ci.yml
          git config user.name "relay-release"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git rm .github/workflows/relay-2.0-cutover-build.yml
          git commit -m "ci: record Relay cutover test inventory"
          git push origin HEAD:relay/2.0-production-cutover-r2-20261001
