name: Relay 2.0 cutover diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/relay-2.0-cutover-build.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.pull_request.head.ref == 'relay/2.0-production-cutover-r2-20261001'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: relay/2.0-production-cutover-r2-20261001
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture failing suite output
        shell: bash
        run: |
          set +e
          npm run test:inspector > /tmp/inspector.log 2>&1
          INSPECTOR=$?
          npm run test:layout > /tmp/layout.log 2>&1
          LAYOUT=$?
          npm run test:contracts > /tmp/contracts.log 2>&1
          CONTRACTS=$?
          npm test --workspace @relay/web > /tmp/web.log 2>&1
          WEB=$?
          {
            echo
            echo "# BEGIN CUTOVER DIAGNOSTICS"
            echo "# inspector_exit=$INSPECTOR layout_exit=$LAYOUT contracts_exit=$CONTRACTS web_exit=$WEB"
            for pair in "INSPECTOR:/tmp/inspector.log" "LAYOUT:/tmp/layout.log" "CONTRACTS:/tmp/contracts.log" "WEB:/tmp/web.log"; do
              label="${pair%%:*}"
              file="${pair#*:}"
              echo "# --- $label ---"
              tail -n 100 "$file" | sed -E $'s/\x1b\\[[0-9;]*[mK]//g' | sed 's/^/# /'
            done
            echo "# END CUTOVER DIAGNOSTICS"
          } >> .github/workflows/ci.yml
          git config user.name "relay-release"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git rm .github/workflows/relay-2.0-cutover-build.yml
          git commit -m "ci: capture Relay 2.0 cutover diagnostics"
          git push origin HEAD:relay/2.0-production-cutover-r2-20261001
